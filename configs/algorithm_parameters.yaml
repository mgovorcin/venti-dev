# Venti Algorithm Parameters
# This file contains algorithm-specific settings with defaults that work for most locations.
# These parameters typically don't change between runs.

calibration_options:
  # GNSS grid type: 'constant' uses velocity-based interpolation,
  # 'variable' uses epoch-specific GNSS positions
  # Type: string
  # Options: ['constant', 'variable']
  grid_type: constant

  # GNSS reference frame to use
  # Type: string
  # Options: ['IGS14', 'IGS20']
  reference_frame: IGS20

  # Whether to correct islands for unwrap errors using watershed segmentation
  # Helps fix phase discontinuities in unwrapped interferograms
  # Type: boolean
  unwrap_error_correction: true

  # Remove the solid Earth tide layer (/corrections/solid_earth_tide) stored
  # in each OPERA DISP-S1 product before the GNSS-referencing fit
  # Products without the layer are calibrated without it (a warning is logged)
  # Type: boolean
  apply_solid_earth_tide_correction: true

  # Recompute GNSS LOS interpolation even if a cached file already exists
  # Set to false to reuse cached results and skip recomputation
  # Type: boolean
  recompute_gnss: true

  # Window size for plane fitting in meters
  # Larger windows smooth more but may miss local variations
  # Typical values: 10000-50000
  # Type: number
  window_size_meters: 30000.0

  # Input data posting (pixel spacing) in meters
  # Used for coordinate transformations
  # Type: number
  posting_meters: 30.0

  # Number of pixels to dilate the event-mask boundary before filling.
  # Expands the excluded region to capture near-boundary pixels contaminated
  # by deformation signal. 0 disables buffering.
  # Type: integer
  event_mask_buffer_pixels: 0

  # Post-assembly low-pass filter applied to the calibration surface.
  # Options: 'gaussian' (default), 'gaussian_fft', 'hanning_fft', 'savitzky_golay'
  # Type: string
  calibration_surface_smoothing_method: gaussian

  # Sigma in pixels for the post-assembly smoothing filter.
  # null = auto-select (window_size_pixels / 8); 0 = disable smoothing entirely.
  # Ignored when calibration_surface_smoothing_method is 'savitzky_golay'.
  # Type: number or null
  calibration_surface_smoothing_sigma: null

  # Savitzky-Golay filter parameters (for 'savitzky_golay' method)
  savitzky_golay:
    # Window length in pixels (must be odd)
    # Type: integer
    window_length: 51

    # Polynomial order for fitting
    # Lower order = smoother, higher order = preserves more detail
    # Type: integer
    polyorder: 3

decomposition_options:
  # Method for least-squares inversion
  # Type: string
  # Options: ['weighted_least_squares', 'ridge', 'lasso']
  inversion_method: weighted_least_squares

  # Whether to compute and propagate uncertainties to output
  # Type: boolean
  uncertainty_propagation: true

  # Minimum number of viewing geometries required for decomposition
  # 2 or more geometries needed to solve for 3D displacement
  # Type: integer
  min_geometries: 2

  # Only solve for vertical component (assume horizontal motion is zero)
  # Useful when only one viewing geometry is available
  # Type: boolean
  vertical_only: false

  # How to weight different viewing geometries in inversion
  # Type: string
  # Options: ['uniform', 'temporal_coherence', 'uncertainty']
  geometry_weighting: temporal_coherence

  # Minimum quality metric for including pixels in decomposition
  # Pixels below this threshold will be masked out
  # Type: number (0.0 to 1.0)
  quality_threshold: 0.5

processing_options:
  # Downsample factor for performing operations at lower resolution
  # Used by calibration (plane fitting) and decomposition (output grids)
  # 1 means no downsampling, 2 means half resolution, etc.
  # Higher values = faster processing but less detail
  # Type: integer
  cal_downsample_factor: 1

  # Method for aggregating pixels during downsampling
  # Used by both calibration and decomposition workflows
  # Type: string
  # Options: ['mean', 'median']
  downsample_method: mean

  # Whether to use weighted downsampling (based on coherence or quality)
  # Used by both calibration and decomposition workflows
  # Type: boolean
  downsample_weighted: false

  # Output grid posting in meters for decomposed ENU components
  # Controls the resolution of output displacement grids
  # If larger than input posting, data will be downsampled/aggregated
  # Type: number
  vlm_output_posting_meters: 120.0

output_options:
  # GDAL creation options for GeoTIFF output files
  # These control compression, tiling, and other file properties
  # Type: array of strings
  gtiff_creation_options:
    - COMPRESS=lzw
    - ZLEVEL=4
    - BIGTIFF=yes
    - TILED=yes
    - BLOCKXSIZE=128
    - BLOCKYSIZE=128

  # Whether to add overviews (pyramids) to output GeoTIFFs
  # Overviews improve visualization performance but increase file size
  # Type: boolean
  add_overviews: false

  # Compression method for output files
  # Type: string
  # Options: ['lzw', 'deflate', 'none']
  compression: lzw
