[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "venti"
authors = [
  { name = "Marin Govorcin", email = "marin.govorcin@jpl.nasa.gov" },
  { name = "Scott Staniewicz", email = "scott.j.staniewicz@jpl.nasa.gov" },
  { name = "Sara Mirzaee", email = "sara.mirzaee@jpl.nasa.gov" },
  { name = "Talib Oliver-Cabrera", email = "talib.oliver.cabrera@jpl.nasa.gov" },
]
description = "Calibrated OPERA DISP with GNSS and project to vertical direction"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"

classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
license = { file = "LICENSE.txt" }
# Keep in sync with environment.yml and [tool.pixi.dependencies].
# Core = the calibration engine: what `cal-disp` (and the future VLM SAS)
# installs. Everything a research workstation also wants (staging, notebooks,
# stack drivers) is an extra. See docs/architecture.md and ADR-0020.
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-image",
  "joblib",
  "tqdm",
  # rasters and NetCDF
  "xarray",
  "rioxarray",
  "netcdf4",
  "h5netcdf",
  "rasterio",
  "gdal",
  # geospatial
  "geopandas",  # GNSS station frames in gnss.los/reference; revisited in plan T28
  "shapely",
  "pyproj>=3.3",
  "requests",
  # configuration and CLI
  "pydantic>=2.0",
  "pyyaml",
  "tyro>=0.9.24",
  # OPERA frame database and product helpers (core, no extras: the `disp`
  # extra pulls in zarr/dask, which the operational image must not carry)
  "opera-utils",
  # imported by `opera_utils` at the top level but not declared by it
  "rich",
  # GNSS retrieval, GPS Imaging and plate motion: single source (plan D10)
  "geepers[grid] @ git+https://github.com/mgovorcin/geepers.git@30182ce425c2a972cc11b2ffba791bde3bba3a4a",
]

# The version will be written into a version.py upon install, auto-generated
# see section: setuptools_scm
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#dynamic-metadata
dynamic = ["version"]

[project.optional-dependencies]
# The PRD names these tiers (D11). Today the core already carries everything
# the calibration engine (venti.calibration) and the decomposition
# (venti.decomposition, numpy only) need, so `calibration` and `decomposition`
# are empty install targets kept for the day they gain a dependency (numba).
calibration = []
decomposition = []
# GIA / PMM context rasters (models/, scripts/get_model_rates.py)
models = []
# Staging of frame inputs (venti.staging), stack drivers, notebooks, analysis
research = [
  "opera-utils[disp,asf]",
  "asf_search",
  "dem-stitcher",
  "pyarrow",  # staging writes GNSS velocities to parquet
  "numba",
  "matplotlib>=3.10.3",
  "ipykernel",
  "ipywidgets",
  "folium",
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-randomly",
  "pytest-xdist",
  "pre-commit",
  "ruff",
]
all = ["venti[calibration,decomposition,models,research]"]

[project.urls]
Homepage = "https://github.com/opera-adt/Venti"
"Bug Tracker" = "https://github.com/opera-adt/Venti/issues"
Discussions = "https://github.com/opera-adt/Venti/discussions"
Changelog = "https://github.com/opera-adt/Venti/releases"

# Entry points for the command line interface
[project.scripts]
venti = "venti.__main__:main"
venti-defo-areas = "venti.research.defo_areas:main"


[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
venti = { path = ".", editable = true }

# Core conda packages (mirrors [project.dependencies] minus pip-only ones)
[tool.pixi.dependencies]
# <3.14: several pypi dependencies (numba, dem-stitcher, ...) have no 3.14 wheels
# yet, and an unbounded floor let the solver pick 3.14 and drop the test tooling.
python = ">=3.11,<3.14"
pip = ">=21.3"
git = "*"
numpy = "*"
pandas = "*"
scipy = "*"
scikit-image = "*"
joblib = "*"
tqdm = "*"
xarray = "*"
rioxarray = "*"
netcdf4 = "*"
h5netcdf = "*"
rasterio = "*"
gdal = "*"
libgdal-netcdf = "*"
# geopandas-base, not geopandas: the conda metapackage drags in matplotlib-base
geopandas-base = "*"
shapely = "*"
pyproj = ">=3.3"
requests = "*"
pydantic = ">=2.0"
pyyaml = "*"
tyro = ">=0.9.24"
# opera-utils comes from PyPI (the PEP 621 entry): the conda-forge package has
# no extras and depends on asf_search, dask and zarr, which the operational
# image must not carry.
rich = "*"
# Without a floor the solver can pick the 2020 `sqlite 3.32.3` tarball, which
# clobbers libsqlite and breaks `import sqlite3` (missing sqlite3_deserialize).
sqlite = ">=3.45"

# `research` = staging + stack drivers + notebooks (the former default set)
[tool.pixi.feature.research.dependencies]
zarr = ">=3"
dask = "*"
aiohttp = "*"
fsspec = "*"
s3fs = "*"
asf_search = "*"
pyarrow = "*"
numba = "*"
matplotlib = ">=3.10.3"
ipython = ">=9.3.0"
ipykernel = "*"
ipywidgets = "*"
folium = "*"
lxml = "*"
ipdb = "*"
contextily = "*"

[tool.pixi.tasks]
# Shared task names (00_tools/standards/pixi-tasks.toml): test, lint, docs, golden, e2e
check = "pre-commit run -a"
lint = "pre-commit run -a"
test = "pytest"
docs = "mkdocs build --strict"
docs-serve = "mkdocs serve"
# Venti has no golden dataset of its own; cal-disp's golden covers it.
golden = "echo 'no golden dataset in this repo; run pixi run validate in cal-disp'"
e2e = "echo 'no e2e validation in this repo; see the validation package'"
clean = "rm -rf build/ dist/ *.egg-info/ .pytest_cache/ .coverage .ruff_cache/ src/venti/_version.py && find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true"


# pixi install -e test
# Test tooling only; notebook/plotting packages live in `research` so the
# `core-test` environment stays a faithful "core + pytest" check.
[tool.pixi.feature.test.dependencies]
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
pytest-randomly = "*"
pytest-xdist = "*"
ruff = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-gen-files = "*"
mkdocs-jupyter = "*"
mkdocs-literate-nav = "*"
mkdocs-material = "*"
pymdown-extensions = "*"
matplotlib = ">=3.10.3"
ipython = ">=9.3.0"
lxml = "*"
contextily = ">=1.6.2,<2"

# pixi install -e docs
[tool.pixi.feature.docs.pypi-dependencies]
mkdocstrings = { extras = ["python"] }
mkdocs-section-index = "*"



[tool.pixi.environments]
# `default` keeps the historical behaviour (core + research tooling).
default = { features = ["research"], solve-group = "default" }
test = { features = ["research", "test"], solve-group = "default" }
docs = { features = ["research", "docs"], solve-group = "default" }
dev = { features = ["research", "test", "docs"], solve-group = "default" }
# `ops` = the calibration core only (what the operational image installs);
# `core-test` = core + test tooling for the import-isolation checks.
ops = { features = [], solve-group = "ops" }
core-test = { features = ["test"], solve-group = "ops" }


[tool.setuptools_scm]
# https://github.com/pypa/setuptools_scm#configuration-parameters
write_to = "src/venti/_version.py"
# https://github.com/pypa/setuptools_scm#version-number-construction
version_scheme = "no-guess-dev" # Will not guess the next version

[tool.ruff]
src = ["src"]
unsafe-fixes = true

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # pycodestyle (errors)
  "W",      # pycodestyle (warnings)
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "F",      # Pyflakes
  "I",      # isort
  "ISC",    # flake8-implicit-str-concat
  "N",      # pep8-naming
  "NPY201", # numpy 2.0 depgrcations
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # Pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "RUF",    # Ruff-specific rules
  "SIM",    # flake8-simplify
  "TRY",    # tryceratops
  "UP",     # pyupgrade  <- not working with Pydantic lower python versions
  "YTT",    # flake8-2020
]

ignore = [
  "PTH123", # `open()` should be replaced by `Path.open()`
  "PLR",    # Pylint Refactor
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D102",   # D102: Missing docstring in public method (TODO: remove this ignore)
  "D213",   # D213: Multi-line docstring summary should start at the second line
  "D203",   # 1 blank line required before class docstring
  "N806",   # Variable _ in function should be lowercase
  "SIM108", # Use ternary operator
  "PLC0415", # `import` should be at the top-level of a file (used for lazy imports)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"tests/**" = ["D", "N", "PTH", "ARG001", "PLR2004", "E501"]
"scripts/*" = ["F401"]
# Staging CLIs moved from scripts/ in plan T17; docstring/complexity debt is theirs
"src/venti/staging/*" = ["D", "PLR2004", "E501", "ARG001", "PLW2901"]
"src/venti/uncertainty.py" = ["RUF002"]                   # let us use sigma here
"src/venti/schemas.py" = ["D106"]

[tool.black]
target-version = ["py311", "py312", "py313"]
preview = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = []


[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"
addopts = "  --cov=venti  --doctest-modules --randomly-seed=1234 --ignore=scripts --ignore=docs --ignore=data --ignore=src/venti/models --ignore=src/venti/staging"
filterwarnings = [
  "error",
  # https://github.com/dateutil/dateutil/pull/1285 will be released, but not yet
  "ignore:datetime.datetime.utcfromtimestamp.*:DeprecationWarning",
  "ignore:.*shapely.geos.*:DeprecationWarning",
  # Ignore deprecation warnings from gps module during testing of deprecated functionality
  "ignore:The 'geepers.gps' module is deprecated.*:DeprecationWarning",
  # Ignore numpy binary incompatibility warnings from netCDF4/xarray
  "ignore:numpy.ndarray size changed.*:RuntimeWarning",
  "ignore:numpy.ufunc size changed.*:RuntimeWarning",
  # Ignore pyproj database path warnings
  "ignore:pyproj unable to set PROJ database path.*:UserWarning",
  # Ignore numpy scalar conversion deprecation from geopandas/pyproj CRS transforms
  "ignore:Conversion of an array with ndim > 0 to a scalar.*:DeprecationWarning",
  # netCDF4 <= 1.7.4 sets `ndarray.shape` when xarray writes a file, which NumPy 2.5
  # deprecates; remove once netCDF4 releases a fix
  "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning",
  # rasterio <= 1.5.1 composes transforms with `*` (e.g. `from_bounds`), which
  # affine 3 deprecates in favour of `@`
  "ignore:Use `@` matmul instead of `\\*` mul operator.*:PendingDeprecationWarning",
]
