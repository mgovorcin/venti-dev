name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgdal-dev gdal-bin

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GDAL Python bindings matching system libgdal
        # Without NumPy at build time (pip's default build isolation) GDAL is built
        # without osgeo.gdal_array, which Venti's gap filling needs.
        run: |
          pip install numpy setuptools wheel
          pip install --no-build-isolation "gdal==$(gdal-config --version)"
          python -c "from osgeo import gdal_array"

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest
